  en:
    name: "ProtoForge"
    description: "Industrial protocol simulation platform: spin up virtual PLCs, meters and cameras on one box, then exercise your SCADA, gateway or IoT platform over Modbus, OPC-UA, MQTT, S7, BACnet and more."
