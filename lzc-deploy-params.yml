params:
  - id: login_password
    type: secret
    name: "Login Password"
    description: "Password for the built-in admin account, at least 8 characters. Demo mode resets the admin password to this value on every start"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    login_password:
      name: "登录密码"
      description: "内置 admin 账号的密码，至少 8 位；demo 模式每次启动都会把 admin 密码重置为该值"
  en:
    login_password:
      name: "Login Password"
      description: "Password for the built-in admin account, at least 8 characters. Demo mode resets the admin password to this value on every start"
